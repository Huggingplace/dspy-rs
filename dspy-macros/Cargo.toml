[package]
name = "dspy-rust-macros"
version = "0.1.0"
edition = "2021"
description = "Proc macros for dspy-rust (derive Signature, etc.)"
license = "MIT"
authors = ["Saumya Garg"]
repository = "https://github.com/Huggingplace/dspy-rs"
homepage = "https://github.com/Huggingplace/dspy-rs"
keywords = ["dspy", "llm", "ai", "macros"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
