[workspace]
resolver = "2"
members = [".", "dspy-macros", "dspy-huggingplace"]

[package]
name = "dspy"
version = "0.1.0"
edition = "2021"
description = "A Rust port of DSPy — programming (not prompting) foundation models"
license = "MIT"

[dependencies]
dspy-macros = { path = "dspy-macros" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = "1"
moka = { version = "0.12", features = ["future"] }
regex = "1"
indicatif = "0.17"
ndarray = "0.16"
rand = "0.9"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
backon = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-stream = "0.1"
pin-project-lite = "0.2"
async-openai = "0.28"

[dev-dependencies]
tokio-test = "0.4"
