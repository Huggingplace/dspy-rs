[package]
name = "dspy-rust-huggingplace"
version = "0.1.0"
edition = "2021"
description = "HuggingPlace LM backend adapter for dspy-rust"
license = "MIT"
authors = ["Saumya Garg"]
repository = "https://github.com/Huggingplace/dspy-rs"
homepage = "https://github.com/Huggingplace/dspy-rs"
keywords = ["dspy", "llm", "huggingplace"]
categories = ["science", "api-bindings"]

[dependencies]
dspy-rust = { path = ".." }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing = "0.1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
